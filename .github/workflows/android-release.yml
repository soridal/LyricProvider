name: Android Multi-App Build

on:
  workflow_dispatch:

jobs:
  build-and-debug:
    name: Build Debug Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle with Caching
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-disabled: false

      # -------------------------------------------------------------
      # 추가된 핵심 단계: 임시 Keystore 생성 및 복사
      # Gradle의 Configuration 단계를 통과하기 위해 요구하는 위치에 가짜 서명 파일을 만들어 줍니다.
      # -------------------------------------------------------------
      - name: Generate Dummy Keystore
        run: |
          # 1. 루트 폴더에 release.jks 생성
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias dummyalias -storepass dummypass -keypass dummypass -dname "CN=Dummy,O=Dummy,C=US"
          
          # 2. 에러 로그에서 요구했던 spotify-music 폴더 안에 파일 복사 (없으면 폴더 생성)
          mkdir -p spotify-music
          cp release.jks spotify-music/release.jks

      - name: Build Debug APK with Caching
        # 릴리즈가 아닌 디버그용으로 빌드합니다.
        run: ./gradlew assembleDebug --build-cache
        # 빌드 스크립트가 환경변수로 서명 정보를 읽어올 경우 에러가 나지 않도록 가짜 정보를 줍니다.
        env:
          RELEASE_STORE_PASSWORD: dummypass
          RELEASE_KEY_ALIAS: dummyalias
          RELEASE_KEY_PASSWORD: dummypass

      - name: Collect APKs to flat directory
        run: |
          mkdir -p collected-apks
          # debug 빌드 결과물 경로로 찾도록 변경
          find . -name "*.apk" -path "*/build/outputs/apk/debug/*" -exec cp {} collected-apks/ \;
          echo "Collected files:"
          ls -lh collected-apks/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: collected-apks/
          if-no-files-found: error
          archive: false

      - name: Cleanup
        if: always()
        run: |
          rm -f release.jks || true
          rm -f spotify-music/release.jks || true
          rm -rf collected-apks || true
